name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Minimum permissions required by this workflow.
permissions:
  contents: read

jobs:

  # ============================================================
  # BACKEND TESTS + COVERAGE
  # ============================================================

  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Backend Source
        working-directory: backend
        run: |
          python -m compileall app
          echo "Backend syntax validation passed."

      - name: Run Backend Tests & Coverage
        working-directory: backend
        run: |
          python -m coverage erase
          pytest \
            --ignore=tests/test_production_smoke.py \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=88 \
            -q

  # ============================================================
  # PRODUCTION SMOKE TEST
  # ============================================================

  production-smoke:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: backend-test

    # Production smoke tests only run after a successful push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Smoke Test Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest

      - name: Validate Smoke Test Secrets
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "$SMOKE_EMAIL" ]; then
            echo "::error::SMOKE_EMAIL secret is missing."
            exit 1
          fi

          if [ -z "$SMOKE_PASSWORD" ]; then
            echo "::error::SMOKE_PASSWORD secret is missing."
            exit 1
          fi

          echo "Smoke test secrets are configured."

      - name: Run Production Smoke Tests
        working-directory: backend
        env:
          AEGIS_BASE_URL: https://aegis-ai-1-eu4a.onrender.com
          SMOKE_FRONTEND_ORIGIN: https://aegis-ai-ruddy.vercel.app
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_TIMEOUT: "30"
        run: |
          pytest -q tests/test_production_smoke.py -v

  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm run build