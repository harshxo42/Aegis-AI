name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # BACKEND TESTS
  # ============================================================

  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Backend Source
        working-directory: backend
        run: |
          echo "Checking Python syntax..."
          python -m compileall app
          echo "Python syntax OK"

      - name: Run Backend Tests & Coverage
        working-directory: backend
        run: |
          python -m coverage erase
          pytest \
            --ignore=tests/test_production_smoke.py \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=88 \
            -q

  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  # ============================================================
  # PRODUCTION SMOKE TEST
  # ============================================================

  production-smoke:
    name: Production Smoke Test
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    # Never run production smoke tests on pull requests.
    # Only run after code is pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Smoke Test Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest

      - name: Verify Smoke Test Configuration
        env:
          SMOKE_EMAIL: ${{ secrets.venor433@gmail.com }}
          SMOKE_PASSWORD: ${{ secrets.@Lex20032 }}
        run: |
          if [ -z "$SMOKE_EMAIL" ]; then
            echo "::error::SMOKE_EMAIL GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$SMOKE_PASSWORD" ]; then
            echo "::error::SMOKE_PASSWORD GitHub Secret is missing."
            exit 1
          fi

          echo "Smoke test credentials are configured."

      - name: Run Production Smoke Tests
        working-directory: backend
        env:
          AEGIS_BASE_URL: https://aegis-ai-1-eu4a.onrender.com
          SMOKE_FRONTEND_ORIGIN: https://aegis-kh6m42xjv-harssx.vercel.app
          SMOKE_EMAIL: ${{ secrets.venor433@gmail.com }}
          SMOKE_PASSWORD: ${{ secrets.@Lex20032 }}
          SMOKE_TIMEOUT: "30"
        run: |
          pytest -q tests/test_production_smoke.py -v