services:

  postgres:
    image: postgres:15
    container_name: aegis_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_ai}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - aegis_internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis_ai}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped

    networks:
      - aegis_internal

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    image: aegis-ai-backend:latest
    container_name: aegis_backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: "redis://redis:6379/0"
      HOST: "0.0.0.0"
      PORT: "8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - aegis_internal

networks:
  aegis_internal:
    driver: bridge

volumes:
  postgres_data:
    external: true